<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
  <title id="t">Experiment tree and cumulative evidence</title>
  <desc id="d">A frozen baseline leads to a universal Claim 4 proof, independent package, four-route audits, and a release candidate.</desc>
  <rect width="1000" height="360" fill="#f7f4ed"/>
  <text x="50" y="55" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#17212b">A stacked evidence tree</text>
  <line x1="110" y1="175" x2="900" y2="175" stroke="#89969c" stroke-width="4"/>
  <g font-family="system-ui,sans-serif">
    <g><circle cx="110" cy="175" r="18" fill="#718892"/><text x="110" y="222" text-anchor="middle" font-size="15">Frozen baseline</text><text x="110" y="244" text-anchor="middle" font-size="13">24.0 s · local</text></g>
    <g><circle cx="300" cy="175" r="18" fill="#aa8744"/><text x="300" y="128" text-anchor="middle" font-size="15">C4 kernel</text><text x="300" y="106" text-anchor="middle" font-size="13">Lean universal proof</text></g>
    <g><circle cx="495" cy="175" r="18" fill="#aa8744"/><text x="495" y="222" text-anchor="middle" font-size="15">C4 package</text><text x="495" y="244" text-anchor="middle" font-size="13">checker + control</text></g>
    <g><circle cx="695" cy="175" r="18" fill="#d98555"/><text x="695" y="128" text-anchor="middle" font-size="15">C1–C3 routes</text><text x="695" y="106" text-anchor="middle" font-size="13">4 routes each</text></g>
    <g><circle cx="900" cy="175" r="18" fill="#3a8b66"/><text x="900" y="222" text-anchor="middle" font-size="15">Release audit</text><text x="900" y="244" text-anchor="middle" font-size="13">visibility + manifests</text></g>
  </g>
  <text x="50" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#4b5965">Every descendant reruns the same locked command and all previously accepted checks.</text>
</svg>
